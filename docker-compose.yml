version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: kogu_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:php8.2-apache
    container_name: kogu_wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      # プラグインをマウント（コード変更が即反映される）
      - ./wordpress-plugin/kogu-rental:/var/www/html/wp-content/plugins/kogu-rental
      # WordPress全体を永続化
      - wp_data:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # WP-CLI: コマンドラインでWordPressを操作するためのツール
  wpcli:
    image: wordpress:cli-php8.2
    container_name: kogu_wpcli
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - ./wordpress-plugin/kogu-rental:/var/www/html/wp-content/plugins/kogu-rental
      - wp_data:/var/www/html
    working_dir: /var/www/html

  # phpMyAdmin: ブラウザでDBを確認できる（開発用）
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: kogu_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: wordpress
      PMA_PASSWORD: wordpress

volumes:
  db_data:
  wp_data:
